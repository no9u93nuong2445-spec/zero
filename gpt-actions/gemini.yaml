openapi: 3.1.0
info:
  title: 彼岸 AI Gemini 文本模式
  version: 2.1.0
  description: 仅用于用户明确进入 Gemini 模式时直接调用 Gemini 文本模型。普通聊天仍由 ChatGPT 完成。
servers:
  - url: https://generativelanguage.googleapis.com

paths:
  /v1beta/interactions:
    post:
      operationId: geminiText
      summary: 使用指定 Gemini 文本模型进行一轮对话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model:
                  type: string
                  enum:
                    - gemini-3.6-flash
                    - gemini-3.5-flash
                    - gemini-3.5-flash-lite
                    - gemini-3.1-pro-preview
                input:
                  type: string
                  maxLength: 50000
                previous_interaction_id:
                  type: string
      responses:
        '200':
          description: Gemini 文本响应。
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  status: {type: string}
                  output_text: {type: string}
        '400': {description: 请求参数无效。}
        '401': {description: Gemini API Key 无效。}
        '403': {description: Gemini API Key 无权限或模型不可用。}
        '404': {description: 指定模型在当前接口不可用。}
        '429': {description: Gemini API 速率限制或配额不足。}

security:
  - geminiApiKey: []

components:
  schemas: {}
  securitySchemes:
    geminiApiKey:
      type: apiKey
      in: header
      name: x-goog-api-key
