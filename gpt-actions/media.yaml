openapi: 3.1.0
info:
  title: 彼岸 AI 媒体桥接器 GitHub Actions
  version: 2.1.0
  description: 自定义 GPT 用于提交 Google 语音、音乐和视频任务，并查询 GitHub Actions 状态。支持模型预设和手动指定模型。
servers:
  - url: https://api.github.com

paths:
  /repos/no9u93nuong2445-spec/doubao-tts-bridge/dispatches:
    post:
      operationId: dispatchMediaJob
      summary: 提交一个 Google 媒体生成任务
      description: GitHub 成功接收 repository_dispatch 时通常返回 HTTP 204 且没有正文。204/空响应代表已接受，不得因此重复提交同一个 request_id。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type, client_payload]
              properties:
                event_type:
                  type: string
                  enum: [google_tts, google_music, google_video]
                client_payload:
                  $ref: '#/components/schemas/MediaPayload'
      responses:
        '204':
          description: GitHub 已接受任务。继续用 listMediaRuns 查询，不要重复 POST。
        '401': {description: GitHub PAT 无效。}
        '403': {description: GitHub PAT 权限不足。}
        '422': {description: 请求参数无效。}

  /repos/no9u93nuong2445-spec/doubao-tts-bridge/actions/workflows/gpt_media_dispatch.yml/runs:
    get:
      operationId: listMediaRuns
      summary: 查询最近的自定义 GPT 媒体任务
      parameters:
        - name: event
          in: query
          required: false
          schema: {type: string, default: repository_dispatch}
        - name: branch
          in: query
          required: false
          schema: {type: string, default: main}
        - name: per_page
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 20, default: 10}
      responses:
        '200':
          description: 最近的工作流运行列表。
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_count: {type: integer}
                  workflow_runs:
                    type: array
                    items: {$ref: '#/components/schemas/WorkflowRun'}

  /repos/no9u93nuong2445-spec/doubao-tts-bridge/actions/runs/{run_id}:
    get:
      operationId: getMediaRun
      summary: 查询指定媒体任务状态
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: 工作流运行状态。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowRun'}

security:
  - bearerAuth: []

components:
  schemas:
    MediaPayload:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
          pattern: '^[A-Za-z0-9._-]{4,100}$'
        text: {type: string, maxLength: 12000}
        voice: {type: string}
        style: {type: string}
        tts_mode:
          type: string
          enum: [latest, fast, pro]
        prompt: {type: string, maxLength: 12000}
        mode:
          type: string
          enum: [clip, pro]
        video_mode:
          type: string
          enum: [omni, veo, veo_fast, veo_lite]
        model:
          type: string
          enum:
            - gemini-3.1-flash-tts-preview
            - gemini-2.5-flash-preview-tts
            - gemini-2.5-pro-preview-tts
            - lyria-3-clip-preview
            - lyria-3-pro-preview
            - gemini-omni-flash-preview
            - veo-3.1-generate-preview
            - veo-3.1-fast-generate-preview
            - veo-3.1-lite-generate-preview
        aspect_ratio:
          type: string
          enum: ['16:9', '9:16']
        duration_seconds:
          type: integer
          minimum: 3
          maximum: 10
        resolution:
          type: string
          enum: [720p, 1080p, 4k]
        output_name: {type: string}

    WorkflowRun:
      type: object
      properties:
        id: {type: integer}
        display_title: {type: string}
        status: {type: string}
        conclusion: {type: string}
        html_url: {type: string}
        created_at: {type: string}
        updated_at: {type: string}

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
