          $bad=@()
          1..36 | ForEach-Object {
            if ($_ -eq 6) { $text=[IO.File]::ReadAllText("$dir/safe-006.txt").Trim()+[IO.File]::ReadAllText("$dir/safe-006-tail.txt").Trim() }
            elseif ($_ -eq 24) { $text=[IO.File]::ReadAllText("$dir/safe-024.txt").Trim()+[IO.File]::ReadAllText("$dir/safe-024-tail.txt").Trim() }
            else { $text=[IO.File]::ReadAllText(("$dir/safe-{0:D3}.txt" -f $_)).Trim() }
            $sha=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::ASCII.GetBytes($text))).ToLowerInvariant()
            $ok=($sha -eq $expected[$_-1])
            Write-Host ("chunk {0:D3} chars={1} sha={2} expected={3} ok={4}" -f $_,$text.Length,$sha,$expected[$_-1],$ok)
            if (!$ok) { $bad += $_ }
          }
          if ($bad.Count -gt 0) { throw "Corrupted V2.2 overlay chunks: $($bad -join ',')" }
          Write-Host 'all V2.2 overlay chunks match canonical source'
