name: AI Video Hub V2.2 Chunk Diagnostic
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ai-video-hub-v2.2-overlay-safe/**'
      - '.github/workflows/ai-video-hub-v2.2-chunk-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify every reconstructed overlay chunk
        shell: pwsh
        run: |
          $dir='ai-video-hub-v2.2-overlay-safe'
