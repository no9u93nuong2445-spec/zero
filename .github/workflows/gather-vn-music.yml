name: Gather VN Music

on:
  pull_request:
    paths:
      - music-trigger.txt

permissions:
  contents: read

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download licensed source tracks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tracks
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://www.scottbuckley.com.au/library/wp-content/uploads/2025/03/Amberlight.mp3" -o tracks/01_Amberlight.mp3
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://www.scottbuckley.com.au/library/wp-content/uploads/2024/03/Simplicity.mp3" -o tracks/02_Simplicity.mp3
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://www.scottbuckley.com.au/library/wp-content/uploads/2023/05/Reawakening.mp3" -o tracks/03_Reawakening.mp3
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://www.scottbuckley.com.au/library/wp-content/uploads/2023/12/Cicadas.mp3" -o tracks/04_Cicadas.mp3
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://www.scottbuckley.com.au/library/wp-content/uploads/2025/04/Incredulity.mp3" -o tracks/05_Incredulity.mp3
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://www.scottbuckley.com.au/library/wp-content/uploads/2025/05/EchoesOfHome.mp3" -o tracks/06_EchoesOfHome.mp3
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://www.scottbuckley.com.au/library/wp-content/uploads/2022/10/AKindOfHope.mp3" -o tracks/07_AKindOfHope.mp3
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://www.scottbuckley.com.au/library/wp-content/uploads/2025/07/Penumbra.mp3" -o tracks/08_Penumbra.mp3
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://www.scottbuckley.com.au/library/wp-content/uploads/2024/06/AtTheEndOfAllThings.mp3" -o tracks/09_AtTheEndOfAllThings.mp3
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://www.scottbuckley.com.au/library/wp-content/uploads/2024/02/ClearSkies.mp3" -o tracks/10_ClearSkies.mp3
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://www.scottbuckley.com.au/library/wp-content/uploads/2025/01/Meanwhile.mp3" -o tracks/11_Meanwhile.mp3
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://www.scottbuckley.com.au/library/wp-content/uploads/2023/05/WithinOurNature.mp3" -o tracks/12_WithinOurNature.mp3
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://www.scottbuckley.com.au/library/wp-content/uploads/2023/01/TheLongDark.mp3" -o tracks/13_TheLongDark.mp3
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://www.scottbuckley.com.au/library/wp-content/uploads/2026/06/WithTheseHands.mp3" -o tracks/14_WithTheseHands.mp3
          find tracks -type f -name '*.mp3' -size +100k | sort
          test "$(find tracks -type f -name '*.mp3' -size +100k | wc -l)" -eq 14
          cat > tracks/LICENSE_NOTICE.txt <<'EOF'
          Music by Scott Buckley – released under CC BY 4.0.
          Source library: https://www.scottbuckley.com.au/library/
          License: https://creativecommons.org/licenses/by/4.0/
          The game project must preserve track-level attribution and modification notes.
          EOF
      - name: Upload music artifact
        uses: actions/upload-artifact@v4
        with:
          name: rain-before-scott-buckley-sources
          path: tracks
          retention-days: 1
          compression-level: 0
