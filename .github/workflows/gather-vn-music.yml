name: Gather VN Music

on:
  pull_request:
    paths:
      - music-trigger.txt

permissions:
  contents: read

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download licensed source tracks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tracks
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          get_track() {
            page="$1"
            url="$2"
            out="$3"
            cookie="$(mktemp)"
            curl -fsSL --retry 3 --retry-delay 2 --compressed -A "$UA" -c "$cookie" "$page" -o /dev/null
            curl -fsSL --retry 3 --retry-delay 2 --compressed -A "$UA" -b "$cookie" -e "$page" \
              -H 'Accept: audio/mpeg,audio/*;q=0.9,application/octet-stream;q=0.8,*/*;q=0.5' \
              -H 'Accept-Language: en-US,en;q=0.9' \
              "$url" -o "$out"
            rm -f "$cookie"
            test -s "$out"
          }
          get_track 'https://www.scottbuckley.com.au/library/amberlight/' 'https://www.scottbuckley.com.au/library/wp-content/uploads/2025/03/Amberlight.mp3' tracks/01_Amberlight.mp3
          get_track 'https://www.scottbuckley.com.au/library/simplicity/' 'https://www.scottbuckley.com.au/library/wp-content/uploads/2024/03/Simplicity.mp3' tracks/02_Simplicity.mp3
          get_track 'https://www.scottbuckley.com.au/library/reawakening/' 'https://www.scottbuckley.com.au/library/wp-content/uploads/2023/05/Reawakening.mp3' tracks/03_Reawakening.mp3
          get_track 'https://www.scottbuckley.com.au/library/cicadas/' 'https://www.scottbuckley.com.au/library/wp-content/uploads/2023/12/Cicadas.mp3' tracks/04_Cicadas.mp3
          get_track 'https://www.scottbuckley.com.au/library/incredulity/' 'https://www.scottbuckley.com.au/library/wp-content/uploads/2025/04/Incredulity.mp3' tracks/05_Incredulity.mp3
          get_track 'https://www.scottbuckley.com.au/library/echoes-of-home/' 'https://www.scottbuckley.com.au/library/wp-content/uploads/2025/05/EchoesOfHome.mp3' tracks/06_EchoesOfHome.mp3
          get_track 'https://www.scottbuckley.com.au/library/a-kind-of-hope/' 'https://www.scottbuckley.com.au/library/wp-content/uploads/2022/10/AKindOfHope.mp3' tracks/07_AKindOfHope.mp3
          get_track 'https://www.scottbuckley.com.au/library/penumbra/' 'https://www.scottbuckley.com.au/library/wp-content/uploads/2025/07/Penumbra.mp3' tracks/08_Penumbra.mp3
          get_track 'https://www.scottbuckley.com.au/library/at-the-end-of-all-things/' 'https://www.scottbuckley.com.au/library/wp-content/uploads/2024/06/AtTheEndOfAllThings.mp3' tracks/09_AtTheEndOfAllThings.mp3
          get_track 'https://www.scottbuckley.com.au/library/clear-skies/' 'https://www.scottbuckley.com.au/library/wp-content/uploads/2024/02/ClearSkies.mp3' tracks/10_ClearSkies.mp3
          get_track 'https://www.scottbuckley.com.au/library/meanwhile/' 'https://www.scottbuckley.com.au/library/wp-content/uploads/2025/01/Meanwhile.mp3' tracks/11_Meanwhile.mp3
          get_track 'https://www.scottbuckley.com.au/library/within-our-nature/' 'https://www.scottbuckley.com.au/library/wp-content/uploads/2023/05/WithinOurNature.mp3' tracks/12_WithinOurNature.mp3
          get_track 'https://www.scottbuckley.com.au/library/the-long-dark/' 'https://www.scottbuckley.com.au/library/wp-content/uploads/2023/01/TheLongDark.mp3' tracks/13_TheLongDark.mp3
          get_track 'https://www.scottbuckley.com.au/library/with-these-hands/' 'https://www.scottbuckley.com.au/library/wp-content/uploads/2026/06/WithTheseHands.mp3' tracks/14_WithTheseHands.mp3
          find tracks -type f -name '*.mp3' -size +100k -printf '%f %s bytes\n' | sort
          test "$(find tracks -type f -name '*.mp3' -size +100k | wc -l)" -eq 14
          cat > tracks/LICENSE_NOTICE.txt <<'EOF'
          Music by Scott Buckley – released under CC BY 4.0.
          Source library: https://www.scottbuckley.com.au/library/
          License: https://creativecommons.org/licenses/by/4.0/
          The game project must preserve track-level attribution and modification notes.
          EOF
      - name: Upload music artifact
        uses: actions/upload-artifact@v4
        with:
          name: rain-before-scott-buckley-sources
          path: tracks
          retention-days: 1
          compression-level: 0
