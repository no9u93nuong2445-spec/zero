name: AI Video Hub V3 dev2 Internal P0 Validation

on:
  push:
    branches: [ ai-video-hub-v3-dev2-internal ]
    paths:
      - 'ai-video-hub-v3-dev2-internal/**'
      - '.github/workflows/ai-video-hub-v3-dev2-internal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Reassemble dev1 verified base
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'ai-video-hub-v3-dev1/payload/part-*.txt' | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 base parts, got $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { [IO.File]::ReadAllText($_.FullName).Trim() }) -join ''
          if ($b64.Length -ne 36820) { throw "Base payload length mismatch: $($b64.Length)" }
          [IO.File]::WriteAllBytes('v3-base.zip', [Convert]::FromBase64String($b64))
          $hash=(Get-FileHash 'v3-base.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '79e330830930943096cb599ca53c84dd2068c3df0a66a443d2e4e9c626cc7173') { throw 'V3 base SHA mismatch' }
          Expand-Archive 'v3-base.zip' -DestinationPath 'src' -Force

      - name: Apply reviewed dev2 overlay
        shell: pwsh
        run: |
          $src='src/AI-Video-Hub-v3.0.0-dev1'
          Copy-Item 'ai-video-hub-v3-dev2-internal/files/*' $src -Recurse -Force
          Rename-Item $src 'AI-Video-Hub-v3.0.0-dev2-internal'

      - name: Static P0 invariants
        shell: pwsh
        run: python src/AI-Video-Hub-v3.0.0-dev2-internal/Tests/verify_project.py

      - name: Restore and build application
        shell: pwsh
        run: |
          dotnet restore src/AI-Video-Hub-v3.0.0-dev2-internal/AI.VideoHub.V3.csproj -r win-x64
          dotnet build src/AI-Video-Hub-v3.0.0-dev2-internal/AI.VideoHub.V3.csproj -c Release -r win-x64 --no-restore

      - name: Restore and build P0 self-test
        shell: pwsh
        run: |
          dotnet restore src/AI-Video-Hub-v3.0.0-dev2-internal/Tests/P0SelfTest/P0SelfTest.csproj -r win-x64
          dotnet build src/AI-Video-Hub-v3.0.0-dev2-internal/Tests/P0SelfTest/P0SelfTest.csproj -c Release -r win-x64 --no-restore

      - name: Ensure real FFmpeg binaries for video regression
        shell: pwsh
        run: |
          $cmdFf=Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          $cmdFp=Get-Command ffprobe.exe -ErrorAction SilentlyContinue
          $cmdFfOk=$cmdFf -and (Test-Path $cmdFf.Source) -and ((Get-Item $cmdFf.Source).Length -gt 1000000)
          $cmdFpOk=$cmdFp -and (Test-Path $cmdFp.Source) -and ((Get-Item $cmdFp.Source).Length -gt 1000000)
          if (-not $cmdFfOk -or -not $cmdFpOk) {
            choco install ffmpeg -y --no-progress
          }
          $roots=@('C:\ProgramData\chocolatey\lib\ffmpeg\tools')
          $ffCandidates=@()
          $fpCandidates=@()
          foreach($root in $roots) {
            if (Test-Path $root) {
              $ffCandidates += Get-ChildItem $root -Recurse -Filter ffmpeg.exe -File -ErrorAction SilentlyContinue
              $fpCandidates += Get-ChildItem $root -Recurse -Filter ffprobe.exe -File -ErrorAction SilentlyContinue
            }
          }
          if ($cmdFfOk) { $ffCandidates += Get-Item $cmdFf.Source }
          if ($cmdFpOk) { $fpCandidates += Get-Item $cmdFp.Source }
          $ff=$ffCandidates | Where-Object Length -gt 1000000 | Sort-Object Length -Descending | Select-Object -First 1
          $fp=$fpCandidates | Where-Object Length -gt 1000000 | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $ff -or -not $fp) { throw 'Real ffmpeg/ffprobe binaries not found; refusing to use Chocolatey shim.' }
          Write-Host "ffmpeg=$($ff.FullName) size=$($ff.Length)"
          Write-Host "ffprobe=$($fp.FullName) size=$($fp.Length)"
          $out='src/AI-Video-Hub-v3.0.0-dev2-internal/Tests/P0SelfTest/bin/Release/net8.0-windows/win-x64'
          New-Item -ItemType Directory -Force "$out/Tools" | Out-Null
          Copy-Item $ff.FullName "$out/Tools/ffmpeg.exe" -Force
          Copy-Item $fp.FullName "$out/Tools/ffprobe.exe" -Force
          if ((Get-Item "$out/Tools/ffmpeg.exe").Length -lt 1000000) { throw 'Bundled ffmpeg is unexpectedly small.' }
          if ((Get-Item "$out/Tools/ffprobe.exe").Length -lt 1000000) { throw 'Bundled ffprobe is unexpectedly small.' }

      - name: Run protocol and real-video P0 tests
        shell: pwsh
        run: |
          $out='src/AI-Video-Hub-v3.0.0-dev2-internal/Tests/P0SelfTest/bin/Release/net8.0-windows/win-x64'
          & "$out/P0SelfTest.exe" --video-test
          if ($LASTEXITCODE -ne 0) { throw "P0 self-test failed exit=$LASTEXITCODE" }

      - name: Publish Windows x64 smoke candidate
        shell: pwsh
        run: |
          dotnet publish src/AI-Video-Hub-v3.0.0-dev2-internal/AI.VideoHub.V3.csproj -c Release -r win-x64 --self-contained true --no-restore -o dist/v3dev2
          $testTools='src/AI-Video-Hub-v3.0.0-dev2-internal/Tests/P0SelfTest/bin/Release/net8.0-windows/win-x64/Tools'
          New-Item -ItemType Directory -Force 'dist/v3dev2/Tools' | Out-Null
          Copy-Item "$testTools/ffmpeg.exe" 'dist/v3dev2/Tools/ffmpeg.exe' -Force
          Copy-Item "$testTools/ffprobe.exe" 'dist/v3dev2/Tools/ffprobe.exe' -Force
          foreach($f in @('AI.VideoHub.V3.exe','Microsoft.Web.WebView2.Core.dll','Microsoft.Web.WebView2.Wpf.dll','VERSION.json','Tools/ffmpeg.exe','Tools/ffprobe.exe')) {
            if (!(Test-Path "dist/v3dev2/$f")) { throw "$f missing" }
          }
          if ((Get-Item 'dist/v3dev2/Tools/ffmpeg.exe').Length -lt 1000000) { throw 'published ffmpeg is unexpectedly small' }
          if ((Get-Item 'dist/v3dev2/Tools/ffprobe.exe').Length -lt 1000000) { throw 'published ffprobe is unexpectedly small' }
