name: AI Video Hub V2.1 Windows Validation
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ai-video-hub-v2.1/**'
      - '.github/workflows/ai-video-hub-v2.1-temp-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Reassemble and verify source
        shell: pwsh
        run: |
          $dir='ai-video-hub-v2.1/parts'
          $p02=[IO.File]::ReadAllText("$dir/part-02a.txt").Trim()+[IO.File]::ReadAllText("$dir/part-02b.txt").Trim()
          $p15=[IO.File]::ReadAllText("$dir/part-15a.txt").Trim()+[IO.File]::ReadAllText("$dir/part-15b.txt").Trim()
          [IO.File]::WriteAllText("$dir/part-02.txt",$p02,[Text.Encoding]::ASCII)
          [IO.File]::WriteAllText("$dir/part-15.txt",$p15,[Text.Encoding]::ASCII)
          $expected=@(
            '0a6018d2c760dc65200d740b3b74bd31ffb474dd723e77cef66ebad88129e667','8457ae4dca5fc27078505742960165aebed3ee14ec0b3e874e7ce540e2bece4a','81912e67cc889789abfd98eeb0a25a645184f57644e091ed4931cbe056fbb5a9','cd5c036042ed106a8233e6241130bf76f52be10f628dd05b26763180775e00a4','a3f8abd5367077d0506bf0a78cec607db20e2faaba7c15953a89c79423aff5a3','31c48ee9aeadd3f62a60adab473d9dfd54f244f3b420f6294dd2d1c5570c9bd3','c0d29f28032afb8d574fc66391c800ca301602fb4796f1e429df36767a45e5b7','d4f40a4a9460bb2771d9c82252329be7b40b53aa3ec326d3258900f444479772','9aa7a3d210950d80851237d252a68ad82777533be8a441f48711cbf9e5170222','8578626a26bc0c433d9729846c6e67c615dc6382af40c42d7331eeef48ebe0e9','2387f3adcfacc1429a1e7287073b8318f475e6385ee1e1a6ab3a850af13004ea','f02ef1d76af640d782d2123eb8df8ae86bf88c39bf78cbd27d8b0140bf89bfa9','cfd8793799eee90a4eaf2aadd5982b999e706627d29962d183085f261a03d07b','9b668d09020def2b870439ba7f667d7e2cd6f38782b14312d27289963517c593','d300f8fc3c86123a1787b04e552279a4c31b428256c59f0a0fcfb852a5fdb053','565dc61c05f8739c8247c02a66f564c64d2b1c40f9a9b35a8ceb08549d9b6aca','062c6db5fdd6b883d23e00a660a0cf8dd7350fa71cb4489a416076cd136b2875','e244b90e14d1d0cc6b006521198a2c4705eeb76dcba63de2d3f352f0ac03bafd','562a55c7ae5593caf4027e1b7a57b992362d36251f458c00e9bc3dc5fb049b0b','87ce1a6320b5bdc70afa5b5c178c3d7673906f27de9ac1411e427190738774d9','8b55f32b0752f3ccf82978187d6a19b7df593598ef4f19526fdd1e6a045ee0ec','983f8e394cc31d8546b996a34bbb3c8f5e7ff04b4739b2ca236bf197d70cd2ed','74669cbd6a79e0e0b39be4fd895167a5be781585a48ca1a23e7f9f21849b6f07','587795d8016304c45bc7a332dbf1f530d642c4c26a2d70ad09f8c89861620104'
          )
          $parts=@(); $bad=@()
          1..24 | ForEach-Object {
            $path=('$dir/part-{0:D2}.txt' -f $_)
            if (!(Test-Path $path)) { throw "Missing source part: $path" }
            $text=[IO.File]::ReadAllText($path).Trim()
            $sha=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::ASCII.GetBytes($text))).ToLowerInvariant()
            $ok=($sha -eq $expected[$_-1])
            Write-Host "$path chars=$($text.Length) sha=$sha ok=$ok"
            if (!$ok) { $bad += $_ }
            $parts += $text
          }
          if ($bad.Count -gt 0) { throw "Corrupted source parts: $($bad -join ',')" }
          $b64=($parts -join '')
          if ($b64.Length -ne 75524) { throw "Source base64 length mismatch: $($b64.Length)" }
          [IO.File]::WriteAllBytes('source.zip',[Convert]::FromBase64String($b64))
          $hash=(Get-FileHash source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "source.zip sha256=$hash"
          if ($hash -ne '5375223c26a29e335a1d400e5ce3d1ecfb4b589b5005004a98a687009614d1bd') { throw 'Source ZIP SHA mismatch' }
          Expand-Archive source.zip -DestinationPath src -Force
      - name: Static regression tests
        shell: pwsh
        run: |
          node src/AI-Video-Hub-v2.1/Tests/test_capture.js
          python src/AI-Video-Hub-v2.1/Tests/verify_project.py
      - name: Restore win-x64 runtime packs
        shell: pwsh
        run: dotnet restore src/AI-Video-Hub-v2.1/AI.VideoHub.csproj -r win-x64
      - name: Build Release
        shell: pwsh
        run: dotnet build src/AI-Video-Hub-v2.1/AI.VideoHub.csproj -c Release -r win-x64 --no-restore
      - name: Publish self-contained Windows x64
        shell: pwsh
        run: dotnet publish src/AI-Video-Hub-v2.1/AI.VideoHub.csproj -c Release -r win-x64 --self-contained true --no-restore -o dist/AI-Video-Hub-v2.1
      - name: Storage durability runtime self-test
        shell: pwsh
        run: |
          $p=Start-Process -FilePath 'dist/AI-Video-Hub-v2.1/AI.VideoHub.exe' -ArgumentList '--selftest-storage' -PassThru -Wait
          Write-Host "storage selftest exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "storage selftest failed exit=$($p.ExitCode)" }
      - name: Runtime WebView2 + single-instance smoke
        shell: pwsh
        run: |
          $appRoot=Join-Path $env:LOCALAPPDATA 'AI Video Hub'
          Remove-Item $appRoot -Recurse -Force -ErrorAction SilentlyContinue
          $data=Join-Path $appRoot 'data'
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          $account=@{ Id='ci-smoke-doubao'; Name='CI 豆包启动测试'; Platform='Doubao'; HomeUrl='https://www.doubao.com/chat/'; CreatedAtUtc=(Get-Date).ToUniversalTime().ToString('o'); StatusText='未打开'; LastQuotaStatus='未知'; LastCapabilityEvidence='' }
          $accountJson=$account | ConvertTo-Json -Depth 4
          [IO.File]::WriteAllText((Join-Path $data 'accounts.json'),"[$accountJson]",[Text.UTF8Encoding]::new($false))
          $exe=(Resolve-Path 'dist/AI-Video-Hub-v2.1/AI.VideoHub.exe').Path
          $proc=Start-Process -FilePath $exe -PassThru
          $deadline=(Get-Date).AddSeconds(50); $initOk=$false; $navOk=$false; $last=''
          try {
            while ((Get-Date) -lt $deadline -and !$proc.HasExited) {
              Start-Sleep -Milliseconds 750
              $log=Get-ChildItem (Join-Path $appRoot 'logs') -Filter 'aivh_*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if ($log) {
                $last=Get-Content $log.FullName -Raw -ErrorAction SilentlyContinue
                if ($last -match 'WebView2 initialization completed') { $initOk=$true }
                if ($last -match 'navigation completed.*https://www\.doubao\.com/') { $navOk=$true; break }
              }
            }
            Write-Host $last
            Write-Host "webview init=$initOk doubao navigation=$navOk"
            if (!$initOk) { throw 'WebView2 controller did not initialize.' }
            if (!$navOk) { throw 'Doubao navigation did not complete.' }
            $probe=Start-Process -FilePath $exe -ArgumentList '--probe-single-instance' -PassThru -Wait
            Write-Host "single-instance probe exit=$($probe.ExitCode)"
            if ($probe.ExitCode -ne 2) { throw "single-instance guard failed; expected exit 2, got $($probe.ExitCode)" }
          } finally { if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } }
      - name: Published-file smoke checks
        shell: pwsh
        run: |
          $root='dist/AI-Video-Hub-v2.1'
          foreach($f in @('AI.VideoHub.exe','Microsoft.Web.WebView2.Core.dll','Microsoft.Web.WebView2.Wpf.dll','Scripts/capture.js','VERSION.json')) { if (!(Test-Path "$root/$f")) { throw "$f missing" } }
          $ver=Get-Content "$root/VERSION.json" -Raw
          if ($ver -notmatch '2.1.0-stable-foundation') { throw 'VERSION.json baseline mismatch' }
          Write-Host 'publish smoke checks passed'
      - name: Package
        shell: pwsh
        run: |
          Copy-Item src/AI-Video-Hub-v2.1/README.md dist/AI-Video-Hub-v2.1/README.txt -Force
          Copy-Item src/AI-Video-Hub-v2.1/CHANGELOG.md dist/AI-Video-Hub-v2.1/CHANGELOG.txt -Force
          Compress-Archive -Path dist/AI-Video-Hub-v2.1/* -DestinationPath AI-Video-Hub-v2.1-Windows-x64.zip -Force
          $hash=(Get-FileHash AI-Video-Hub-v2.1-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $hash | Out-File AI-Video-Hub-v2.1-Windows-x64.zip.sha256 -Encoding ascii
          Write-Host "release zip sha256=$hash"
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Hub-v2.1-Windows-x64
          path: |
            AI-Video-Hub-v2.1-Windows-x64.zip
            AI-Video-Hub-v2.1-Windows-x64.zip.sha256
          if-no-files-found: error
