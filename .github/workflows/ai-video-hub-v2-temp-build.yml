name: AI Video Hub V2 Temporary Windows Build
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ai-video-hub-v2/**'
      - '.github/workflows/ai-video-hub-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify, reassemble and decode isolated V2 source
        shell: pwsh
        run: |
          $ordered = @(
            @{p='ai-video-hub-v2/parts/part-01-a.txt'; h='2de7564d02c70b8e4cb3d8d9f923ca4d5f1e499083e0ffe593a3ebadbb7ebc2f'},
            @{p='ai-video-hub-v2/parts/part-01-b.txt'; h='4ee15fdd741752d398732a1bb9fff8c7068222239a65e7d54b8959d0fb683a0e'},
            @{p='ai-video-hub-v2/parts/part-02.txt'; h='cd5c664123d320197b28c5628c22faaee7704ab3fe840cec478637cf5c3695b7'},
            @{p='ai-video-hub-v2/parts/part-03.txt'; h='97533790df2fa7330761c9bc1717c1c7d409d8ca6fce2299aeadfa2f6354548d'},
            @{p='ai-video-hub-v2/parts/part-04.txt'; h='286c4695c8d9f4d4072c5fe01b78d6d2758a6ec0bb8c103d0091df582f82e24a'},
            @{p='ai-video-hub-v2/parts/part-05.txt'; h='392cd80d28d3d3acde429349e232243628058f9ab56a5c3c260466363f6eea89'},
            @{p='ai-video-hub-v2/parts/part-06.txt'; h='a0bd732d77094b4352e4b2b35b77fa753703fbfab1a620c5d2926c0cf3b867d8'},
            @{p='ai-video-hub-v2/parts/part-07.txt'; h='8a579d5018e40edd471e3b78f710bd0510823ae2f29e332557d39a8d5665ceb8'},
            @{p='ai-video-hub-v2/parts/part-08.txt'; h='92347d6e4dbeab9988e577f01342e6efd963f131fb76ab7d2345e638b9b54ecf'}
          )
          $pieces=@(); $bad=@()
          foreach ($item in $ordered) {
            if (!(Test-Path $item.p)) { $bad += "missing:$($item.p)"; continue }
            $text=[IO.File]::ReadAllText($item.p).Trim()
            $bytes=[Text.Encoding]::UTF8.GetBytes($text)
            $sha=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
            $ok=($sha -eq $item.h)
            Write-Host "$($item.p) chars=$($text.Length) sha256=$sha expected=$($item.h) ok=$ok"
            if (!$ok) { $bad += $item.p }
            $pieces += $text
          }
          if ($bad.Count -gt 0) { throw "Source part mismatches: $($bad -join ', ')" }
          $b64 = ($pieces -join '')
          Write-Host "combined base64 chars=$($b64.Length)"
          if ($b64.Length -ne 55888) { throw "Source base64 length mismatch: $($b64.Length)" }
          [IO.File]::WriteAllBytes('source.zip',[Convert]::FromBase64String($b64))
          $sourceHash=(Get-FileHash source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "source.zip sha256=$sourceHash"
          if ($sourceHash -ne 'c1d320a6935a29b4d7f1bdbbff4ad3d8723e77e2b96ee755c3ed0d9088588cce') { throw "Source ZIP SHA mismatch" }
          Expand-Archive source.zip -DestinationPath src -Force
      - name: Restore
        shell: pwsh
        run: dotnet restore src/AI-Video-Hub-v2.0/AI.VideoHub.csproj
      - name: Build
        shell: pwsh
        run: dotnet build src/AI-Video-Hub-v2.0/AI.VideoHub.csproj -c Release --no-restore
      - name: Publish self-contained Windows x64
        shell: pwsh
        run: dotnet publish src/AI-Video-Hub-v2.0/AI.VideoHub.csproj -c Release -r win-x64 --self-contained true --no-restore -o dist/AI-Video-Hub-v2.0
      - name: Smoke checks
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/AI-Video-Hub-v2.0/AI.VideoHub.exe')) { throw 'AI.VideoHub.exe missing' }
          if (!(Test-Path 'dist/AI-Video-Hub-v2.0/Microsoft.Web.WebView2.Core.dll')) { throw 'WebView2 Core missing' }
          if (!(Test-Path 'dist/AI-Video-Hub-v2.0/Scripts/capture.js')) { throw 'capture.js missing' }
      - name: Package
        shell: pwsh
        run: |
          Copy-Item src/AI-Video-Hub-v2.0/README.md dist/AI-Video-Hub-v2.0/README.txt -Force
          Compress-Archive -Path dist/AI-Video-Hub-v2.0/* -DestinationPath AI-Video-Hub-v2.0-Windows-x64.zip -Force
          $hash=(Get-FileHash AI-Video-Hub-v2.0-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $hash | Out-File AI-Video-Hub-v2.0-Windows-x64.zip.sha256 -Encoding ascii
          Write-Host "release zip sha256=$hash"
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Hub-v2.0-Windows-x64
          path: |
            AI-Video-Hub-v2.0-Windows-x64.zip
            AI-Video-Hub-v2.0-Windows-x64.zip.sha256
          if-no-files-found: error
