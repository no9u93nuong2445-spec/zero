name: AI Video Hub V2 Temporary Windows Build
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ai-video-hub-v2/**'
      - '.github/workflows/ai-video-hub-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Reassemble and verify isolated V2 source
        shell: pwsh
        run: |
          $files = Get-ChildItem 'ai-video-hub-v2/parts/part-*.txt' | Sort-Object Name
          foreach ($f in $files) {
            $len = ([IO.File]::ReadAllText($f.FullName).Trim()).Length
            Write-Host "$($f.Name) chars=$len"
          }
          if ($files.Count -ne 8) { throw "Expected 8 source parts, found $($files.Count)" }
          $b64 = (($files | ForEach-Object { [IO.File]::ReadAllText($_.FullName).Trim() }) -join '')
          Write-Host "combined base64 chars=$($b64.Length)"
          if ($b64.Length -ne 55888) { throw "Source base64 length mismatch: $($b64.Length)" }
          [IO.File]::WriteAllBytes('source.zip',[Convert]::FromBase64String($b64))
          $sourceHash=(Get-FileHash source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "source.zip sha256=$sourceHash"
          if ($sourceHash -ne 'c1d320a6935a29b4d7f1bdbbff4ad3d8723e77e2b96ee755c3ed0d9088588cce') { throw "Source ZIP SHA mismatch" }
          Expand-Archive source.zip -DestinationPath src -Force
      - name: Restore
        shell: pwsh
        run: dotnet restore src/AI-Video-Hub-v2.0/AI.VideoHub.csproj
      - name: Build
        shell: pwsh
        run: dotnet build src/AI-Video-Hub-v2.0/AI.VideoHub.csproj -c Release --no-restore
      - name: Publish self-contained Windows x64
        shell: pwsh
        run: dotnet publish src/AI-Video-Hub-v2.0/AI.VideoHub.csproj -c Release -r win-x64 --self-contained true --no-restore -o dist/AI-Video-Hub-v2.0
      - name: Smoke checks
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/AI-Video-Hub-v2.0/AI.VideoHub.exe')) { throw 'AI.VideoHub.exe missing' }
          if (!(Test-Path 'dist/AI-Video-Hub-v2.0/Microsoft.Web.WebView2.Core.dll')) { throw 'WebView2 Core missing' }
          if (!(Test-Path 'dist/AI-Video-Hub-v2.0/Scripts/capture.js')) { throw 'capture.js missing' }
      - name: Package
        shell: pwsh
        run: |
          Copy-Item src/AI-Video-Hub-v2.0/README.md dist/AI-Video-Hub-v2.0/README.txt -Force
          Compress-Archive -Path dist/AI-Video-Hub-v2.0/* -DestinationPath AI-Video-Hub-v2.0-Windows-x64.zip -Force
          $hash=(Get-FileHash AI-Video-Hub-v2.0-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $hash | Out-File AI-Video-Hub-v2.0-Windows-x64.zip.sha256 -Encoding ascii
          Write-Host "release zip sha256=$hash"
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Hub-v2.0-Windows-x64
          path: |
            AI-Video-Hub-v2.0-Windows-x64.zip
            AI-Video-Hub-v2.0-Windows-x64.zip.sha256
          if-no-files-found: error
