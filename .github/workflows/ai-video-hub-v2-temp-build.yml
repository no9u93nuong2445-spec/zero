name: AI Video Hub V2 Temporary Windows Build
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ai-video-hub-v2-temp-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Read isolated V2 source from build branch
        shell: pwsh
        run: |
          git fetch origin ai-video-hub-v2-build
          git show origin/ai-video-hub-v2-build:ai-video-hub-v2/source.zip.b64 | Out-File source.zip.b64 -Encoding ascii
          $b64 = Get-Content source.zip.b64 -Raw
          [IO.File]::WriteAllBytes('source.zip',[Convert]::FromBase64String($b64))
          Expand-Archive source.zip -DestinationPath src -Force
      - name: Restore
        shell: pwsh
        run: dotnet restore src/AI-Video-Hub-v2.0/AI.VideoHub.csproj
      - name: Build
        shell: pwsh
        run: dotnet build src/AI-Video-Hub-v2.0/AI.VideoHub.csproj -c Release --no-restore
      - name: Publish self-contained Windows x64
        shell: pwsh
        run: dotnet publish src/AI-Video-Hub-v2.0/AI.VideoHub.csproj -c Release -r win-x64 --self-contained true --no-restore -o dist/AI-Video-Hub-v2.0
      - name: Smoke checks
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/AI-Video-Hub-v2.0/AI.VideoHub.exe')) { throw 'AI.VideoHub.exe missing' }
          if (!(Test-Path 'dist/AI-Video-Hub-v2.0/Microsoft.Web.WebView2.Core.dll')) { throw 'WebView2 Core missing' }
          if (!(Test-Path 'dist/AI-Video-Hub-v2.0/Scripts/capture.js')) { throw 'capture.js missing' }
          Get-ChildItem dist/AI-Video-Hub-v2.0 | Select Name,Length | Format-Table
      - name: Package
        shell: pwsh
        run: |
          Copy-Item src/AI-Video-Hub-v2.0/README.md dist/AI-Video-Hub-v2.0/README.txt -Force
          Compress-Archive -Path dist/AI-Video-Hub-v2.0/* -DestinationPath AI-Video-Hub-v2.0-Windows-x64.zip -Force
          $hash=(Get-FileHash AI-Video-Hub-v2.0-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $hash | Out-File AI-Video-Hub-v2.0-Windows-x64.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Hub-v2.0-Windows-x64
          path: |
            AI-Video-Hub-v2.0-Windows-x64.zip
            AI-Video-Hub-v2.0-Windows-x64.zip.sha256
          if-no-files-found: error
      - name: Record run id for ChatGPT retrieval
        shell: pwsh
        run: |
          $hash=(Get-Content AI-Video-Hub-v2.0-Windows-x64.zip.sha256 -Raw).Trim()
          $obj=[ordered]@{run_id='${{ github.run_id }}';run_attempt='${{ github.run_attempt }}';commit='${{ github.sha }}';artifact_name='AI-Video-Hub-v2.0-Windows-x64';zip_sha256=$hash}
          $obj | ConvertTo-Json | Out-File ai-video-hub-v2-build-result.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-video-hub-v2-build-result.json
          git commit -m '[skip ci] Record AI Video Hub V2 build result'
          git push origin HEAD:main
