name: AI Video Hub V2.2 Windows Validation
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ai-video-hub-v2.2-overlay/**'
      - 'ai-video-hub-v2.2-overlay-safe/**'
      - '.github/workflows/ai-video-hub-v2.2-temp-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Reassemble verified V2.1 base source
        shell: pwsh
        run: |
          $dir='ai-video-hub-v2.1/parts'
          $p02=[IO.File]::ReadAllText("$dir/part-02a.txt").Trim()+[IO.File]::ReadAllText("$dir/part-02b.txt").Trim()
          $p15=[IO.File]::ReadAllText("$dir/part-15-1.txt").Trim()+[IO.File]::ReadAllText("$dir/part-15-2.txt").Trim()+[IO.File]::ReadAllText("$dir/part-15-3.txt").Trim()+[IO.File]::ReadAllText("$dir/part-15-4.txt").Trim()
          $parts=@()
          1..24 | ForEach-Object {
            if ($_ -eq 2) { $text=$p02 }
            elseif ($_ -eq 15) { $text=$p15 }
            else { $text=[IO.File]::ReadAllText(("$dir/part-{0:D2}.txt" -f $_)).Trim() }
            $parts += $text
          }
          $b64=($parts -join '')
          if ($b64.Length -ne 75524) { throw "V2.1 base64 length mismatch: $($b64.Length)" }
          [IO.File]::WriteAllBytes('source-v21.zip',[Convert]::FromBase64String($b64))
          $hash=(Get-FileHash source-v21.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "V2.1 source sha256=$hash"
          if ($hash -ne '5375223c26a29e335a1d400e5ce3d1ecfb4b589b5005004a98a687009614d1bd') { throw 'V2.1 source ZIP SHA mismatch' }
          Expand-Archive source-v21.zip -DestinationPath src -Force
          Copy-Item 'src/AI-Video-Hub-v2.1' 'src/AI-Video-Hub-v2.2' -Recurse -Force
      - name: Reassemble and verify V2.2 protocol overlay
        shell: pwsh
        run: |
          $dir='ai-video-hub-v2.2-overlay-safe'
          $parts=@()
          1..36 | ForEach-Object {
            $path=("$dir/safe-{0:D3}.txt" -f $_)
            if (!(Test-Path $path)) { throw "Missing overlay part: $path" }
            $parts += [IO.File]::ReadAllText($path).Trim()
          }
          $b64=($parts -join '')
          Write-Host "overlay base64 chars=$($b64.Length)"
          if ($b64.Length -ne 63740) { throw "Overlay base64 length mismatch: $($b64.Length)" }
          [IO.File]::WriteAllBytes('v22-overlay.zip',[Convert]::FromBase64String($b64))
          $hash=(Get-FileHash v22-overlay.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "overlay sha256=$hash"
          if ($hash -ne 'fb762b9c8faca59a7f4d81d30734ace5d6307f7b5c267bf3e257ad4969dbcab6') { throw 'V2.2 overlay ZIP SHA mismatch' }
          Expand-Archive v22-overlay.zip -DestinationPath 'src/AI-Video-Hub-v2.2' -Force
      - name: Static regression tests
        shell: pwsh
        run: |
          node src/AI-Video-Hub-v2.2/Tests/test_capture.js
          python src/AI-Video-Hub-v2.2/Tests/verify_project.py
      - name: Restore win-x64 runtime packs
        shell: pwsh
        run: dotnet restore src/AI-Video-Hub-v2.2/AI.VideoHub.csproj -r win-x64
      - name: Build Release
        shell: pwsh
        run: dotnet build src/AI-Video-Hub-v2.2/AI.VideoHub.csproj -c Release -r win-x64 --no-restore
      - name: Publish self-contained Windows x64
        shell: pwsh
        run: dotnet publish src/AI-Video-Hub-v2.2/AI.VideoHub.csproj -c Release -r win-x64 --self-contained true --no-restore -o dist/AI-Video-Hub-v2.2
      - name: Doubao protocol runtime self-test
        shell: pwsh
        run: |
          $p=Start-Process -FilePath 'dist/AI-Video-Hub-v2.2/AI.VideoHub.exe' -ArgumentList '--selftest-protocol' -PassThru -Wait
          Write-Host "protocol selftest exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "protocol selftest failed exit=$($p.ExitCode)" }
      - name: Storage durability runtime self-test
        shell: pwsh
        run: |
          $p=Start-Process -FilePath 'dist/AI-Video-Hub-v2.2/AI.VideoHub.exe' -ArgumentList '--selftest-storage' -PassThru -Wait
          Write-Host "storage selftest exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "storage selftest failed exit=$($p.ExitCode)" }
      - name: Runtime WebView2 + Doubao + single-instance smoke
        shell: pwsh
        run: |
          $appRoot=Join-Path $env:LOCALAPPDATA 'AI Video Hub'
          Remove-Item $appRoot -Recurse -Force -ErrorAction SilentlyContinue
          $data=Join-Path $appRoot 'data'
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          $account=@{ Id='ci-smoke-doubao'; Name='CI 豆包启动测试'; Platform='Doubao'; HomeUrl='https://www.doubao.com/chat/'; CreatedAtUtc=(Get-Date).ToUniversalTime().ToString('o'); StatusText='未打开'; LastQuotaStatus='未知'; LastCapabilityEvidence='' }
          $accountJson=$account | ConvertTo-Json -Depth 4
          [IO.File]::WriteAllText((Join-Path $data 'accounts.json'),"[$accountJson]",[Text.UTF8Encoding]::new($false))
          $exe=(Resolve-Path 'dist/AI-Video-Hub-v2.2/AI.VideoHub.exe').Path
          $proc=Start-Process -FilePath $exe -PassThru
          $deadline=(Get-Date).AddSeconds(55); $initOk=$false; $navOk=$false; $last=''
          try {
            while ((Get-Date) -lt $deadline -and !$proc.HasExited) {
              Start-Sleep -Milliseconds 750
              $log=Get-ChildItem (Join-Path $appRoot 'logs') -Filter 'aivh_*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if ($log) {
                $last=Get-Content $log.FullName -Raw -ErrorAction SilentlyContinue
                if ($last -match 'WebView2 initialization completed') { $initOk=$true }
                if ($last -match 'navigation completed.*https://www\.doubao\.com/') { $navOk=$true; break }
              }
            }
            Write-Host $last
            Write-Host "webview init=$initOk doubao navigation=$navOk"
            if (!$initOk) { throw 'WebView2 controller did not initialize.' }
            if (!$navOk) { throw 'Doubao navigation did not complete.' }
            $probe=Start-Process -FilePath $exe -ArgumentList '--probe-single-instance' -PassThru -Wait
            Write-Host "single-instance probe exit=$($probe.ExitCode)"
            if ($probe.ExitCode -ne 2) { throw "single-instance guard failed; expected exit 2, got $($probe.ExitCode)" }
          } finally { if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } }
      - name: Published-file smoke checks
        shell: pwsh
        run: |
          $root='dist/AI-Video-Hub-v2.2'
          foreach($f in @('AI.VideoHub.exe','Microsoft.Web.WebView2.Core.dll','Microsoft.Web.WebView2.Wpf.dll','Scripts/capture.js','VERSION.json')) { if (!(Test-Path "$root/$f")) { throw "$f missing" } }
          $ver=Get-Content "$root/VERSION.json" -Raw
          if ($ver -notmatch '2.2.0-host-network-capture') { throw 'VERSION.json baseline mismatch' }
          Write-Host 'publish smoke checks passed'
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AI-Video-Hub-v2.2/* -DestinationPath AI-Video-Hub-v2.2-Windows-x64.zip -Force
          $hash=(Get-FileHash AI-Video-Hub-v2.2-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $hash | Out-File AI-Video-Hub-v2.2-Windows-x64.zip.sha256 -Encoding ascii
          Write-Host "release zip sha256=$hash"
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Hub-v2.2-Windows-x64
          path: |
            AI-Video-Hub-v2.2-Windows-x64.zip
            AI-Video-Hub-v2.2-Windows-x64.zip.sha256
          if-no-files-found: error
